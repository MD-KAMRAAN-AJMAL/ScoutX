[project]
name = "scoutx-backend"
version = "0.1.0"
description = "Local-first intelligent file recommendation backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "celery[redis]>=5.7,<5.8",
    "fastapi>=0.115,<1",
    "langchain-core>=1.7,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-magic>=0.4.27,<0.5",
    "qdrant-client>=1.14,<2",
    "redis>=5,<7",
    "sqlalchemy>=2.0.40,<2.1",
    "uvicorn[standard]>=0.34,<1",
    "watchdog>=7.1,<8",
]

[project.optional-dependencies]
extraction = [
    "docling>=2.129,<3",
    "faster-whisper>=1.2.1,<2",
    "openpyxl>=3.1,<4",
    "opencv-python-headless>=4.12,<6",
    "paddleocr>=3.7,<4",
    "tika>=3.1,<4",
    "tree-sitter-language-pack>=1.24,<2",
]
embedding = [
    "sentence-transformers>=6.2,<7",
    "transformers>=4.51,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
